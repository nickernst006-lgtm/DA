name: Сборка IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Найти проект
        run: |
          echo "Файлы в корне репозитория:"
          ls -la
          ROOT=""
          if [ -f project.yml ]; then
            ROOT="."
          else
            found=$(find . -maxdepth 3 -name project.yml -not -path "./_src/*" | head -1)
            if [ -n "$found" ]; then
              ROOT=$(dirname "$found")
            else
              # Если архивов несколько, берём самую новую версию.
              zipfile=$(find . -maxdepth 2 -name "*.zip" | sort -V | tail -1)
              if [ -n "$zipfile" ]; then
                echo "Распаковываю $zipfile"
                unzip -q "$zipfile" -d _src
                found=$(find _src -maxdepth 3 -name project.yml | head -1)
                [ -n "$found" ] && ROOT=$(dirname "$found")
              fi
            fi
          fi
          if [ -z "$ROOT" ]; then
            echo "::error::Не найден project.yml. Загрузите в репозиторий распакованные файлы проекта."
            exit 1
          fi
          echo "Проект найден в: $ROOT"
          ls -la "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Обновить базу фильмов из Wikidata
        # Если Wikidata недоступна, сборка продолжится с прежней базой.
        continue-on-error: true
        timeout-minutes: 20
        run: |
          cd "$ROOT"
          python3 scripts/fetch_wikidata.py --limit 10000

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Проверить базу фильмов
        run: |
          cd "$ROOT"
          python3 scripts/check_films.py

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Создать проект Xcode
        run: |
          cd "$ROOT"
          xcodegen generate

      - name: Собрать приложение (без подписи)
        run: |
          cd "$ROOT"
          set -o pipefail
          xcodebuild \
            -project Seans.xcodeproj \
            -target Seans \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$GITHUB_WORKSPACE/xcodebuild.log" 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$GITHUB_WORKSPACE/xcodebuild.log" | head -60 || true
          test -d build/Release-iphoneos/Seans.app

      - name: Упаковать IPA
        run: |
          cd "$ROOT"
          rm -rf Payload Seans.ipa
          mkdir Payload
          cp -R build/Release-iphoneos/Seans.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Seans.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/Seans.ipa"

      - name: Выложить IPA
        uses: actions/upload-artifact@v4
        with:
          name: Seans-ipa
          path: Seans.ipa
          retention-days: 30

      - name: Сохранить журнал сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
