name: Сборка IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Проверить базу фильмов
        run: python3 scripts/check_films.py

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Создать проект Xcode
        run: xcodegen generate

      - name: Собрать приложение (без подписи)
        run: |
          set -o pipefail
          xcodebuild \
            -project Seans.xcodeproj \
            -target Seans \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/Seans.app

      - name: Упаковать IPA
        run: |
          rm -rf Payload Seans.ipa
          mkdir Payload
          cp -R build/Release-iphoneos/Seans.app Payload/
          zip -qry Seans.ipa Payload
          ls -lh Seans.ipa

      - name: Выложить IPA
        uses: actions/upload-artifact@v4
        with:
          name: Seans-ipa
          path: Seans.ipa
          retention-days: 30

      - name: Сохранить журнал сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
