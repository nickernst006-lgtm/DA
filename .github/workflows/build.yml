name: Сборка IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Найти проект
        run: |
          echo "Файлы в корне репозитория:"
          ls -la
          ROOT=""
          if [ -f project.yml ]; then
            ROOT="."
          else
            # Проект лежит во вложенной папке?
            found=$(find . -maxdepth 3 -name project.yml -not -path "./_src/*" | head -1)
            if [ -n "$found" ]; then
              ROOT=$(dirname "$found")
            else
              # Загружен zip-архив? Распакуем его.
              # Если архивов несколько, берём самую новую версию.
              zipfile=$(find . -maxdepth 2 -name "*.zip" | sort -V | tail -1)
              if [ -n "$zipfile" ]; then
                echo "Распаковываю $zipfile"
                unzip -q "$zipfile" -d _src
                found=$(find _src -maxdepth 3 -name project.yml | head -1)
                [ -n "$found" ] && ROOT=$(dirname "$found")
              fi
            fi
          fi
          if [ -z "$ROOT" ]; then
            echo "::error::Не найден project.yml. Загрузите в репозиторий распакованные файлы проекта."
            exit 1
          fi
          echo "Проект найден в: $ROOT"
          ls -la "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Вшить адрес сервера
        # Публичный адрес и ключ приложения — из секретов. Секретного ключа здесь нет.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cd "$ROOT"
          python3 scripts/write_server_config.py

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Создать проект Xcode
        run: |
          cd "$ROOT"
          xcodegen generate

      - name: Собрать приложение (без подписи)
        run: |
          cd "$ROOT"
          set -o pipefail
          xcodebuild \
            -project Seans.xcodeproj \
            -target Seans \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$GITHUB_WORKSPACE/xcodebuild.log" 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$GITHUB_WORKSPACE/xcodebuild.log" | head -60 || true
          # Сборка с ошибками оставляет пустую папку Seans.app — такой IPA не ставится. Останавливаемся явно.
          if ! grep -q "BUILD SUCCEEDED" "$GITHUB_WORKSPACE/xcodebuild.log" || [ ! -f build/Release-iphoneos/Seans.app/Info.plist ]; then
            echo "::error::Приложение не собралось — ошибки выше и в xcodebuild-log"
            grep -E "error:" "$GITHUB_WORKSPACE/xcodebuild.log" | sed 's/^.*Seans\//Seans\//' | sort -u | head -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Упаковать IPA
        run: |
          cd "$ROOT"
          rm -rf Payload Seans.ipa
          mkdir Payload
          cp -R build/Release-iphoneos/Seans.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Seans.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/Seans.ipa"

      - name: Выложить IPA
        uses: actions/upload-artifact@v4
        with:
          name: Seans-ipa
          path: Seans.ipa
          retention-days: 30

      - name: Сохранить журнал сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
